# Lints: flutter_lints plus a short list of stricter rules, and riverpod_lint
# (an analysis_server_plugin, reported by `flutter analyze` / `dart analyze`).
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - "**/*.g.dart"
    - lib/l10n/generated/**
  language:
    strict-casts: true
    strict-raw-types: true

plugins:
  riverpod_lint: ^3.1.9

linter:
  rules:
    always_declare_return_types: true
    avoid_dynamic_calls: true
    directives_ordering: true
    prefer_final_locals: true
    prefer_single_quotes: true
    sort_child_properties_last: true
    unawaited_futures: true
